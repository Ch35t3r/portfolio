<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game — Mark Chester Samaniego</title>
<meta name="description" content="Game details, screenshots and gameplay video.">
<style>
:root{--bg:#0b0d17;--card:#141828;--text:#e8eaf3;--muted:#9aa1bd;--accent:#f5b83d;--accent2:#7c5cff;--line:#232843;--hero1:#10223a;--hero2:#0b4a78}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--text:#161a2b;--muted:#5b627e;--accent:#c98600;--accent2:#5b3fe0;--line:#e1e4f0;--hero1:#e6efff;--hero2:#bcd8ff}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
nav b{letter-spacing:.5px;color:var(--text)}nav a.back{color:var(--muted);font-size:14px}nav a.back:hover{color:var(--accent)}

/* hero panel: title + teaser on the left, game icon on the right */
.hero{display:flex;align-items:center;justify-content:space-between;gap:32px;margin-top:24px;padding:40px 44px;border-radius:22px;border:1px solid var(--line);
 background:radial-gradient(500px 260px at 90% 0,color-mix(in srgb,var(--accent2) 25%,transparent),transparent),linear-gradient(135deg,var(--hero1),var(--hero2))}
.hero-text{max-width:600px}
.tag{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,50px);line-height:1.1;margin:8px 0 16px;text-transform:uppercase;letter-spacing:.5px}
.hero p{color:var(--text);opacity:.85;margin:0 0 24px}
.watch{display:inline-block;background:var(--accent);color:#1a1300;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:12px 26px;border-radius:99px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.hero-icon{width:230px;height:230px;flex:none;border-radius:24px;object-fit:cover;box-shadow:0 14px 40px #0008;background:#0003}
@media(max-width:760px){.hero{flex-direction:column-reverse;align-items:flex-start;padding:28px 22px}.hero-icon{width:150px;height:150px}}

.layout{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:24px;padding:24px 0 48px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:24px}
.panel h2{font-size:14px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.panel.side h2{color:var(--accent)}
.overview p{margin:0 0 16px;color:var(--text);opacity:.88;white-space:pre-line}
.overview h3{font-size:17px;margin:24px 0 6px}
.overview>:last-child{margin-bottom:0}

.video{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;margin-bottom:16px}
.video:last-child{margin-bottom:0}
.video video,.video iframe{width:100%;height:100%;border:0;display:block;background:#000}
.video.portrait{aspect-ratio:9/16;max-width:340px;margin-left:auto;margin-right:auto}
.video.missing{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),#1b1f3a);color:#ffffffcc;text-align:center;padding:20px}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.shots button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:zoom-in;aspect-ratio:16/9;transition:transform .2s}
.shots button:hover{transform:translateY(-3px)}
.shots.mobile{display:flex;flex-wrap:wrap;align-items:flex-start}
.shots.mobile button{height:240px;aspect-ratio:auto;flex:0 0 auto}
.shots.mobile img{width:auto;height:100%;object-fit:contain}
.shots img{width:100%;height:100%;object-fit:cover;display:block}

dl{margin:0;font-size:15px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
dt{color:var(--muted)}dd{margin:0;text-align:right;font-weight:700}
.sub{font-size:13px;color:var(--muted);margin:18px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);padding:5px 12px;border-radius:99px;font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:24px 0}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;border:1px solid var(--line);color:var(--text);display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.lb{position:fixed;inset:0;background:#000e;display:none;place-items:center;z-index:20;padding:20px}
.lb.on{display:grid}.lb img{max-width:100%;max-height:88vh;border-radius:10px}
.lb button{position:absolute;background:#ffffff22;color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .x{top:16px;right:16px}.lb .pv{left:16px;top:50%}.lb .nx{right:16px;top:50%}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<nav><div class="wrap"><b>MCS<span style="color:var(--accent)">.</span></b><a class="back" href="index.html#games">← Back to all games</a></div></nav>

<main class="wrap">
<section class="hero">
 <div class="hero-text">
  <div class="tag" id="type"></div>
  <h1 id="title"></h1>
  <p id="tagline"></p>
  <a class="watch" href="#gameplay">▶ Watch gameplay</a>
 </div>
 <img class="hero-icon" id="icon" alt="">
</section>

<div class="layout">
 <div>
  <div class="panel"><h2>Game overview</h2><div class="overview" id="overview"></div></div>
  <div class="panel" id="gameplay"><h2>Gameplay video</h2><div id="videos"></div></div>
  <div class="panel" id="deskPanel"><h2>Screenshots</h2><div class="shots" id="shots"></div></div>
  <div class="panel" id="mobPanel"><h2>Mobile screenshots</h2><div class="shots mobile" id="mshots"></div></div>
 </div>
 <aside>
  <div class="panel side"><h2>Game details</h2><dl id="details"></dl>
   <div id="hl"><div class="sub">Highlights</div><div class="chips" id="highlights"></div></div></div>
 </aside>
</div>
<div class="pager"><a class="btn" id="prev" href="#">← Previous</a><a class="btn" href="index.html#games">All games</a><a class="btn" id="next" href="#">Next →</a></div>
</main>

<footer><div class="wrap">© <span id="y"></span> Mark Chester Samaniego</div></footer>

<div class="lb" id="lb"><button class="x" aria-label="Close">✕</button><button class="pv" aria-label="Previous">‹</button><img alt=""><button class="nx" aria-label="Next">›</button></div>

<script src="games.js"></script>
<script>
const G=window.GAMES,id=new URLSearchParams(location.search).get("id");
let i=G.findIndex(g=>g.id===id);if(i<0)i=0;
const g=G[i],$=s=>document.getElementById(s);
document.title=g.title+" — Mark Chester Samaniego";
$("type").textContent=g.type;$("title").textContent=g.title;$("tagline").textContent=g.tagline;
$("y").textContent=new Date().getFullYear();

// icon (falls back to the first screenshot, hidden if neither loads)
const ic=$("icon");ic.alt=g.title+" icon";
ic.onerror=()=>{if(g.thumb&&!ic.src.endsWith(g.thumb))ic.src=g.thumb;else ic.style.display="none"};
ic.src=g.icon||g.thumb;

// overview: blank line = new paragraph, "## " = sub-heading
const ov=$("overview");
(g.overview||"").split(/\n\s*\n/).forEach(b=>{
 b=b.trim();if(!b)return;
 const parts=b.split("\n"),first=parts[0];
 if(first.startsWith("## ")){const h=document.createElement("h3");h.textContent=first.slice(3);ov.appendChild(h);
  const rest=parts.slice(1).join("\n");if(rest){const p=document.createElement("p");p.textContent=rest;ov.appendChild(p)}}
 else{const p=document.createElement("p");p.textContent=b;ov.appendChild(p)}
});
// videos (g.videos = list of mp4 paths; a portrait clip is shown in a phone-shaped box)
const vbox=$("videos");
function mkBox(){const b=document.createElement("div");b.className="video";vbox.appendChild(b);return b}
function noVideo(b){b.className="video missing";b.textContent="Gameplay video coming soon"}
if(g.embed){const b=mkBox(),f=document.createElement("iframe");f.src=g.embed;f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;f.title=g.title+" gameplay";b.appendChild(f)}
else if(g.videos&&g.videos.length){g.videos.forEach(src=>{const b=mkBox(),el=document.createElement("video");
 el.controls=true;el.preload="metadata";el.playsInline=true;if(g.poster)el.poster=g.poster;
 el.addEventListener("loadedmetadata",()=>{if(el.videoHeight>el.videoWidth)b.classList.add("portrait")});
 const s=document.createElement("source");s.src=src;s.type="video/mp4";s.onerror=()=>noVideo(b);el.appendChild(s);b.appendChild(el)})}
else noVideo(mkBox());

// details + highlights
(g.details||[]).forEach(([k,val])=>{const r=document.createElement("div"),dt=document.createElement("dt"),dd=document.createElement("dd");
 r.className="row";dt.textContent=k;dd.textContent=val;r.append(dt,dd);$("details").appendChild(r)});
if(g.highlights&&g.highlights.length)g.highlights.forEach(t=>{const c=document.createElement("span");c.className="chip";c.textContent=t;$("highlights").appendChild(c)});
else $("hl").style.display="none";

// screenshots (desktop + mobile) + lightbox over all of them
const all=[...(g.shots||[]),...(g.mobileShots||[])];
const lb=$("lb"),lbi=lb.querySelector("img");let cur=0;
function show(n){cur=(n+all.length)%all.length;lbi.src=all[cur];lb.classList.add("on")}
function fill(list,box,offset,label){
 if(!list||!list.length){box.parentElement.style.display="none";return}
 list.forEach((src,n)=>{const b=document.createElement("button"),im=document.createElement("img");
  im.loading=box.id==="mshots"?"eager":"lazy";im.alt=g.title+" "+label+" "+(n+1);im.src=src;im.onerror=()=>{b.style.display="none"};
  b.appendChild(im);b.onclick=()=>show(offset+n);box.appendChild(b)})}
fill(g.shots,$("shots"),0,"screenshot");
fill(g.mobileShots,$("mshots"),(g.shots||[]).length,"mobile screenshot");
lb.querySelector(".x").onclick=()=>lb.classList.remove("on");
lb.querySelector(".pv").onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector(".nx").onclick=e=>{e.stopPropagation();show(cur+1)};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove("on")};
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;
 if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});

// prev / next game
const p=G[(i-1+G.length)%G.length],n=G[(i+1)%G.length];
$("prev").href="game.html?id="+p.id;$("prev").textContent="← "+p.title;
$("next").href="game.html?id="+n.id;$("next").textContent=n.title+" →";
</script>
</body>
</html>
