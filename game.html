<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game — Mark Chester Samaniego</title>
<meta name="description" content="Game details, screenshots and gameplay video.">
<style>
:root{--bg:#0b0d17;--card:#141828;--text:#e8eaf3;--muted:#9aa1bd;--accent:#f5b83d;--accent2:#7c5cff;--line:#232843}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--text:#161a2b;--muted:#5b627e;--accent:#c98600;--accent2:#5b3fe0;--line:#e1e4f0}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
nav b{letter-spacing:.5px;color:var(--text)}nav a.back{color:var(--muted);font-size:14px}nav a.back:hover{color:var(--accent)}
.head{padding:44px 0 24px;background:radial-gradient(600px 260px at 85% 0,color-mix(in srgb,var(--accent2) 28%,transparent),transparent)}
.tag{color:var(--accent);font-weight:600;font-size:14px;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:8px 0}
.head p{color:var(--muted);font-size:18px;max-width:720px;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px;padding:12px 0 48px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
h2{font-size:20px;margin:0 0 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.panel p{margin:0;color:var(--muted)}
.video{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;margin-bottom:20px}
.video video,.video iframe{width:100%;height:100%;border:0;display:block;background:#000}
.video.missing{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),#1b1f3a);color:#ffffffcc;text-align:center;padding:20px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.shots button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:zoom-in;aspect-ratio:16/9;transition:transform .2s}
.shots button:hover{transform:translateY(-3px)}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
dt{color:var(--muted)}dd{margin:0;text-align:right;font-weight:600}
ul{margin:0;padding-left:20px;color:var(--muted)}li{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);padding:5px 12px;border-radius:99px;font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:24px 0}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;border:1px solid var(--line);color:var(--text);display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.lb{position:fixed;inset:0;background:#000e;display:none;place-items:center;z-index:20;padding:20px}
.lb.on{display:grid}.lb img{max-width:100%;max-height:88vh;border-radius:10px}
.lb button{position:absolute;background:#ffffff22;color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .x{top:16px;right:16px}.lb .pv{left:16px;top:50%}.lb .nx{right:16px;top:50%}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<nav><div class="wrap"><b>MCS<span style="color:var(--accent)">.</span></b><a class="back" href="index.html#games">← Back to all games</a></div></nav>

<header class="head"><div class="wrap">
<div class="tag" id="type"></div>
<h1 id="title"></h1>
<p id="tagline"></p>
</div></header>

<main class="wrap">
<div class="layout">
 <div>
  <div class="video" id="video"></div>
  <div class="panel"><h2>Screenshots</h2><div class="shots" id="shots"></div></div>
  <div class="panel"><h2>About the game</h2><p id="desc"></p></div>
  <div class="panel"><h2>My role</h2><p id="role"></p></div>
 </div>
 <aside>
  <div class="panel"><h2>Game details</h2><dl id="facts"></dl></div>
  <div class="panel"><h2>Highlights</h2><ul id="features"></ul></div>
  <div class="panel"><h2>Tech used</h2><div class="chips" id="tech"></div>
   <p class="note">Live game links are not available, so a gameplay video and screenshots are shown instead.</p></div>
 </aside>
</div>
<div class="pager"><a class="btn" id="prev" href="#">← Previous</a><a class="btn" href="index.html#games">All games</a><a class="btn" id="next" href="#">Next →</a></div>
</main>

<footer><div class="wrap">© <span id="y"></span> Mark Chester Samaniego</div></footer>

<div class="lb" id="lb"><button class="x" aria-label="Close">✕</button><button class="pv" aria-label="Previous">‹</button><img alt=""><button class="nx" aria-label="Next">›</button></div>

<script src="games.js"></script>
<script>
const G=window.GAMES,id=new URLSearchParams(location.search).get("id");
let i=G.findIndex(g=>g.id===id);if(i<0)i=0;
const g=G[i],$=s=>document.getElementById(s);
document.title=g.title+" — Mark Chester Samaniego";
$("type").textContent=g.type;$("title").textContent=g.title;$("tagline").textContent=g.tagline;
$("desc").textContent=g.description;$("role").textContent=g.role;
$("y").textContent=new Date().getFullYear();

// video
const v=$("video");
function noVideo(){v.className="video missing";v.textContent="Gameplay video coming soon"}
if(g.embed){const f=document.createElement("iframe");f.src=g.embed;f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;f.title=g.title+" gameplay";v.appendChild(f)}
else if(g.video){const el=document.createElement("video");el.controls=true;el.preload="metadata";el.playsInline=true;if(g.poster)el.poster=g.poster;
 const s=document.createElement("source");s.src=g.video;s.type="video/mp4";s.onerror=noVideo;el.appendChild(s);v.appendChild(el)}
else noVideo();

// facts, features, tech
(g.facts||[]).forEach(([k,val])=>{const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=k;dd.textContent=val;$("facts").append(dt,dd)});
(g.features||[]).forEach(t=>{const li=document.createElement("li");li.textContent=t;$("features").appendChild(li)});
(g.tech||[]).forEach(t=>{const c=document.createElement("span");c.className="chip";c.textContent=t;$("tech").appendChild(c)});

// screenshots + lightbox
const lb=$("lb"),lbi=lb.querySelector("img");let cur=0;
function show(n){cur=(n+g.shots.length)%g.shots.length;lbi.src=g.shots[cur];lb.classList.add("on")}
g.shots.forEach((src,n)=>{const b=document.createElement("button"),im=document.createElement("img");
 im.loading="lazy";im.alt=g.title+" screenshot "+(n+1);im.src=src;im.onerror=()=>{b.style.display="none"};
 b.appendChild(im);b.onclick=()=>show(n);$("shots").appendChild(b)});
lb.querySelector(".x").onclick=()=>lb.classList.remove("on");
lb.querySelector(".pv").onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector(".nx").onclick=e=>{e.stopPropagation();show(cur+1)};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove("on")};
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;
 if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});

// prev / next game
const p=G[(i-1+G.length)%G.length],n=G[(i+1)%G.length];
$("prev").href="game.html?id="+p.id;$("prev").textContent="← "+p.title;
$("next").href="game.html?id="+n.id;$("next").textContent=n.title+" →";
</script>
</body>
</html>
